name: Biotech Daily Monitor
on:
  workflow_dispatch:

# 防止两次运行重叠导致 push 冲突
concurrency:
  group: biotech-daily-monitor
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser cloudscraper beautifulsoup4 google-genai requests playwright translators
          playwright install chromium --with-deps

      - name: Run logic
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python -u main.py

      - name: Save state
        if: always()   # 脚本中途异常，也保存已经写入的记录
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          for f in sent_urls.txt sent_bpiq.txt sent_rttnews.txt sent_rttnews_links.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "Update sent database [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
